site_name: Learning Notes
site_url: https://dragonwarrior15.github.io/statistical-learning-notes/
docs_dir: docs
site_dir: site
use_directory_urls: false
theme:
  name: material
  features:
  - navigation.footer
  - navigation.indexes
  - navigation.tabs
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
plugins:
- search
not_in_nav: 'notes/probability/chapters/references.md

  notes/probability/chapters/exercises/a_*.md

  notes/differential_equations/exercises/a_*.md

  '
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
- admonition
- attr_list
- md_in_html
- sane_lists
- tables
- toc:
    permalink: true
- pymdownx.arithmatex:
    generic: true
- pymdownx.highlight:
    anchor_linenums: true
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.superfences
