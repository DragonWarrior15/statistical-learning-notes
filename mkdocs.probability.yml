site_name: Learning Notes — Probability
docs_dir: docs
site_dir: site/probability
use_directory_urls: false
theme:
  name: material
  features:
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
plugins:
- search
not_in_nav: 'probability/chapters/references.md

  probability/chapters/exercises/a_*.md

  '
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.arithmatex:
    generic: true
- pymdownx.highlight:
    anchor_linenums: true
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.superfences
nav:
- Home: index.md
- Probability:
  - Probability Theorems:
    - probability/chapters/theorems/probability_theorems.md
    - Expectation, Variance and Covariance: probability/chapters/theorems/expectation_var.md
