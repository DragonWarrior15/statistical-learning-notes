<svg width="520" height="300" viewBox="0 0 520 300"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Arrowhead -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="8" refY="3" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- RNN cell -->
  <rect x="190" y="105" width="140" height="80"
        rx="8" ry="8"
        fill="none"
        stroke="currentColor"
        stroke-width="2"/>

  <text x="260" y="151"
        text-anchor="middle"
        dominant-baseline="middle"
        font-size="20"
        font-family="sans-serif">
    W
  </text>

  <!-- z_{i-1}: left input -->
  <line x1="70" y1="145" x2="190" y2="145"
        stroke="currentColor"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <text x="55" y="140"
        text-anchor="end"
        font-size="20"
        font-family="sans-serif">
    zᵢ₋₁
  </text>

  <!-- z_i: right output -->
  <line x1="330" y1="145" x2="450" y2="145"
        stroke="currentColor"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <text x="465" y="140"
        font-size="20"
        font-family="sans-serif">
    zᵢ
  </text>

  <!-- x_i: bottom input -->
  <line x1="260" y1="270" x2="260" y2="185"
        stroke="currentColor"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <text x="260" y="290"
        text-anchor="middle"
        font-size="20"
        font-family="sans-serif">
    xᵢ
  </text>

  <!-- y_i: top output -->
  <line x1="260" y1="105" x2="260" y2="30"
        stroke="currentColor"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <text x="260" y="20"
        text-anchor="middle"
        font-size="20"
        font-family="sans-serif">
    yᵢ
  </text>

</svg>