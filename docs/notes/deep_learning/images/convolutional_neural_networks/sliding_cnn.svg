<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="500"
     viewBox="0 0 900 500">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10"
            refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="white"/>

  <!-- ================================================= -->
  <!-- TITLE -->
  <!-- ================================================= -->

  <text x="450" y="35"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold">
    Sliding-Window CNN
  </text>

  <text x="450" y="60"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#555">
    Repeated applications of the same CNN can be viewed as one convolutional operation
  </text>


  <!-- ================================================= -->
  <!-- INPUT IMAGE -->
  <!-- ================================================= -->

  <text x="120" y="90"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold">
    Large image
  </text>

  <!-- 4 x 4 image -->
  <g stroke="#777" stroke-width="1">

    <rect x="40" y="105" width="40" height="40" fill="#eeeeee"/>
    <rect x="80" y="105" width="40" height="40" fill="#eeeeee"/>
    <rect x="120" y="105" width="40" height="40" fill="#eeeeee"/>
    <rect x="160" y="105" width="40" height="40" fill="#eeeeee"/>

    <rect x="40" y="145" width="40" height="40" fill="#eeeeee"/>
    <rect x="80" y="145" width="40" height="40" fill="#eeeeee"/>
    <rect x="120" y="145" width="40" height="40" fill="#eeeeee"/>
    <rect x="160" y="145" width="40" height="40" fill="#eeeeee"/>

    <rect x="40" y="185" width="40" height="40" fill="#eeeeee"/>
    <rect x="80" y="185" width="40" height="40" fill="#eeeeee"/>
    <rect x="120" y="185" width="40" height="40" fill="#eeeeee"/>
    <rect x="160" y="185" width="40" height="40" fill="#eeeeee"/>

    <rect x="40" y="225" width="40" height="40" fill="#eeeeee"/>
    <rect x="80" y="225" width="40" height="40" fill="#eeeeee"/>
    <rect x="120" y="225" width="40" height="40" fill="#eeeeee"/>
    <rect x="160" y="225" width="40" height="40" fill="#eeeeee"/>
  </g>

  <!-- Object-like pattern -->
  <circle cx="140" cy="185" r="20"
          fill="#bde0fe"
          stroke="#2563eb"
          stroke-width="2"/>

  <!-- Three overlapping windows -->
  <rect x="40" y="105"
        width="80" height="80"
        fill="none"
        stroke="#e63946"
        stroke-width="4"/>

  <rect x="80" y="105"
        width="80" height="80"
        fill="none"
        stroke="#f4a261"
        stroke-width="4"/>

  <rect x="80" y="145"
        width="80" height="80"
        fill="none"
        stroke="#2a9d8f"
        stroke-width="4"/>

  <!-- Movement arrows -->
  <path d="M55 285 C100 305, 145 305, 185 285"
        fill="none"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <text x="120" y="325"
        text-anchor="middle"
        font-family="Arial"
        font-size="12"
        fill="#555">
    overlapping regions
  </text>


  <!-- ================================================= -->
  <!-- MANY INVOCATIONS OF SAME CNN -->
  <!-- ================================================= -->

  <line x1="210" y1="185"
        x2="265" y2="185"
        stroke="#333"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>

  <text x="300" y="90"
        text-anchor="middle"
        font-family="Arial"
        font-size="15"
        font-weight="bold">
    Repeated CNN
  </text>

  <!-- CNN boxes -->
  <rect x="265" y="105"
        width="110"
        height="55"
        rx="8"
        fill="#dbeafe"
        stroke="#2563eb"
        stroke-width="2"/>

  <text x="320" y="129"
        text-anchor="middle"
        font-family="Arial"
        font-size="16"
        font-weight="bold">
    CNN
  </text>

  <text x="320" y="147"
        text-anchor="middle"
        font-family="Arial"
        font-size="10">
    window 1
  </text>


  <rect x="265" y="175"
        width="110"
        height="55"
        rx="8"
        fill="#dbeafe"
        stroke="#2563eb"
        stroke-width="2"/>

  <text x="320" y="199"
        text-anchor="middle"
        font-family="Arial"
        font-size="16"
        font-weight="bold">
    CNN
  </text>

  <text x="320" y="217"
        text-anchor="middle"
        font-family="Arial"
        font-size="10">
    window 2
  </text>


  <rect x="265" y="245"
        width="110"
        height="55"
        rx="8"
        fill="#dbeafe"
        stroke="#2563eb"
        stroke-width="2"/>

  <text x="320" y="269"
        text-anchor="middle"
        font-family="Arial"
        font-size="16"
        font-weight="bold">
    CNN
  </text>

  <text x="320" y="287"
        text-anchor="middle"
        font-family="Arial"
        font-size="10">
    window 3
  </text>

  <!-- Shared weights bracket -->
  <path d="M390 105 L405 105 L405 300 L390 300"
        fill="none"
        stroke="#2563eb"
        stroke-width="2"/>

  <text x="425" y="205"
        text-anchor="middle"
        font-family="Arial"
        font-size="12"
        fill="#2563eb"
        transform="rotate(90 425 205)">
    SAME WEIGHTS
  </text>


  <!-- ================================================= -->
  <!-- OUTPUTS -->
  <!-- ================================================= -->

  <line x1="440" y1="185"
        x2="495" y2="185"
        stroke="#333"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>

  <text x="545" y="90"
        text-anchor="middle"
        font-family="Arial"
        font-size="15"
        font-weight="bold">
    Outputs
  </text>

  <!-- Individual output nodes -->
  <circle cx="515" cy="125" r="16"
          fill="#f9c2d1"
          stroke="#c2185b"
          stroke-width="2"/>

  <circle cx="515" cy="195" r="16"
          fill="#f9c2d1"
          stroke="#c2185b"
          stroke-width="2"/>

  <circle cx="515" cy="265" r="16"
          fill="#f9c2d1"
          stroke="#c2185b"
          stroke-width="2"/>

  <text x="515" y="129"
        text-anchor="middle"
        font-family="Arial"
        font-size="9">
    y₁
  </text>

  <text x="515" y="199"
        text-anchor="middle"
        font-family="Arial"
        font-size="9">
    y₂
  </text>

  <text x="515" y="269"
        text-anchor="middle"
        font-family="Arial"
        font-size="9">
    y₃
  </text>


  <!-- ================================================= -->
  <!-- EQUIVALENT CNN OPERATION -->
  <!-- ================================================= -->

  <line x1="545" y1="195"
        x2="600" y2="195"
        stroke="#2563eb"
        stroke-width="3"
        marker-end="url(#arrowBlue)"/>

  <text x="630" y="90"
        text-anchor="middle"
        font-family="Arial"
        font-size="15"
        font-weight="bold">
    Equivalent view
  </text>

  <!-- Large output feature map -->
  <g stroke="#777" stroke-width="1">

    <rect x="575" y="110" width="35" height="35" fill="#f9c2d1"/>
    <rect x="610" y="110" width="35" height="35" fill="#f9c2d1"/>
    <rect x="645" y="110" width="35" height="35" fill="#f9c2d1"/>

    <rect x="575" y="145" width="35" height="35" fill="#f9c2d1"/>
    <rect x="610" y="145" width="35" height="35" fill="#f9c2d1"/>
    <rect x="645" y="145" width="35" height="35" fill="#f9c2d1"/>

    <rect x="575" y="180" width="35" height="35" fill="#f9c2d1"/>
    <rect x="610" y="180" width="35" height="35" fill="#f9c2d1"/>
    <rect x="645" y="180" width="35" height="35" fill="#f9c2d1"/>
  </g>

  <!-- Highlight spatial correspondence -->
  <rect x="575" y="110"
        width="35" height="35"
        fill="none"
        stroke="#2563eb"
        stroke-width="3"/>

  <rect x="610" y="110"
        width="35" height="35"
        fill="none"
        stroke="#2563eb"
        stroke-width="3"/>

  <rect x="575" y="145"
        width="35" height="35"
        fill="none"
        stroke="#2563eb"
        stroke-width="3"/>


  <text x="630" y="240"
        text-anchor="middle"
        font-family="Arial"
        font-size="12"
        font-weight="bold">
    Feature map
  </text>

  <text x="630" y="260"
        text-anchor="middle"
        font-family="Arial"
        font-size="11">
    one output per window
  </text>


  <!-- ================================================= -->
  <!-- CENTRAL INSIGHT -->
  <!-- ================================================= -->

  <rect x="150" y="365"
        width="600"
        height="75"
        rx="12"
        fill="#f5f5f5"
        stroke="#555"
        stroke-width="1.5"/>

  <text x="450" y="393"
        text-anchor="middle"
        font-family="Arial"
        font-size="16"
        font-weight="bold">
    Repeated CNN evaluations ≈ one convolution
  </text>

  <text x="450" y="418"
        text-anchor="middle"
        font-family="Arial"
        font-size="12">
    Same computation • shared weights • different spatial locations
  </text>

</svg>